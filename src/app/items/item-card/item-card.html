<article class="item-card">
  <div class="thumb">
    <img [ngSrc]="item().imageUrl" width="300" height="225" style="object-fit: contain" [alt]="item().name" />
  </div>
  <div class="title-row">
    <h2>{{ item().name }}</h2>
    <span class="price">{{ item().price | currency }}</span>
  </div>
  <div class="quantity-controls">
    <button type="button" (click)="decrement()" [attr.aria-label]="'Зменшити кількість: ' + item().name">−</button>
    <span class="quantity">{{ quantity() }}</span>
    <button type="button" (click)="increment()" [attr.aria-label]="'Збільшити кількість: ' + item().name">+</button>
  </div>
  <button type="button" class="add-button" (click)="onAddToCart()">Додати в кошик</button>
</article>
