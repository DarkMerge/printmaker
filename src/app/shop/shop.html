<div class="shop-layout">
  <main class="catalogue">
    <div class="catalogue-header">
      <h1>Catalogue</h1>
      <span class="catalogue-meta">{{ items.items().length }} parts · printed on demand in PLA</span>
    </div>

    <div class="item-grid">
      @for (item of items.items(); track item.id) {
        <app-item-card
          [item]="item"
          [quantityInCart]="cart.quantityFor(item.id)"
          (addToCart)="cart.add($event)"
        />
      } @empty {
        <p>No items yet.</p>
      }
    </div>
  </main>

  <app-cart-panel class="cart-aside" />
</div>
