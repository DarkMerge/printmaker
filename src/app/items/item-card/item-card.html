<article class="item-card">
  <div class="thumb">
    <img [ngSrc]="item().imageUrl" width="300" height="225" style="object-fit: contain" [alt]="item().name" />
  </div>
  <div class="title-row">
    <h2>{{ item().name }}</h2>
    <span class="price">{{ item().price | currency }}</span>
  </div>
  <div class="stock">{{ stockLabel() }}</div>
  <button type="button" class="add-button" [disabled]="disabled()" (click)="addToCart.emit(item())">
    {{ buttonLabel() }}
  </button>
</article>
