<div class="shop-layout">
  <main class="catalogue">
    <div class="item-grid">
      @for (item of items.items(); track item.id) {
        <app-item-card [item]="item" (addToCart)="cart.add($event.item, $event.quantity)" />
      } @empty {
        <p>Поки що немає товарів.</p>
      }
    </div>
  </main>

  <app-cart-panel class="cart-aside" />
</div>
