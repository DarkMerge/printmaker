<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-name">printmaker</span>
    </div>
    <div class="cart-anchor" #cartAnchor>
      <button type="button" class="cart-pill" (click)="toggleCart()" [attr.aria-expanded]="cartOpen()">
        <span class="cart-count" [style.animation]="cart.totalQuantity() > 0 ? 'pm-pop .35s ease' : 'none'">
          {{ cart.totalQuantity() }}
        </span>
        <span class="cart-label">в кошику</span>
        <span class="cart-divider"></span>
        <span class="cart-total">{{ cart.subtotal() | currency }}</span>
      </button>

      @defer (when cartOpen()) {
        @if (cartOpen()) {
          <div class="cart-popover">
            <app-cart-panel />
          </div>
        }
      }
    </div>
  </div>
</header>

<main>
  <router-outlet />
</main>

<app-order-success
  [visible]="checkoutSuccess.state() !== null"
  [orderNumber]="checkoutSuccess.state()?.orderNumber ?? ''"
  [summary]="checkoutSuccess.state()?.summary ?? ''"
  (dismissed)="onCheckoutSuccessDismissed()"
/>
